name: ${COMPOSE_PROJECT_NAME:-dspy-trainer}
services:
  postgres:
    image: postgres:16-alpine
    command: ["postgres", "-c", "max_connections=300"]
    container_name: ${COMPOSE_PROJECT_NAME:-dspy-trainer}-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dspy_trainer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dspy_trainer"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-dspy-trainer}-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  mlflow:
    build:
      context: .
      dockerfile: ops/mlflow/Dockerfile
    image: dspy-trainer-mlflow
    container_name: ${COMPOSE_PROJECT_NAME:-dspy-trainer}-mlflow
    depends_on:
      postgres:
        condition: service_healthy
    command: ["/bin/sh", "/opt/mlflow/start.sh"]
    environment:
      MLFLOW_BACKEND_SCHEMA: mlflow
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg2://postgres:postgres@postgres:5432/dspy_trainer?options=-csearch_path%3Dmlflow
      MLFLOW_WEB_WORKERS: ${MLFLOW_WEB_WORKERS:-4}
      # Serve MLflow at ROOT (no path prefix). Caddy presents it under /mlflow for the
      # browser by stripping the prefix; internal clients use the root tracking URI so the
      # span-ingest endpoint (/v1/traces, which ignores --static-prefix) is reachable.
      MLFLOW_STATIC_PREFIX: ${MLFLOW_STATIC_PREFIX:-}
      CADDY_HTTP_PORT: ${CADDY_HTTP_PORT:-8080}
      MLFLOW_CORS_ALLOWED_ORIGINS: ${MLFLOW_CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      MLFLOW_ALLOWED_HOSTS_EXTRA: ${MLFLOW_ALLOWED_HOSTS_EXTRA:-}
    volumes:
      - ./ops/mlflow/start.sh:/opt/mlflow/start.sh:ro
      - mlflow_artifacts:/mlflow/artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; base=os.environ.get('MLFLOW_STATIC_PREFIX', '').rstrip('/'); urllib.request.urlopen(f'http://localhost:5000{base}/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: ${DSPY_TRAINER_BACKEND_IMAGE:-dspy-trainer-backend:local}
    container_name: ${COMPOSE_PROJECT_NAME:-dspy-trainer}-backend
    environment:
      DSPY_TRAINER_POSTGRES_DSN: postgresql://postgres:postgres@postgres:5432/dspy_trainer
      DSPY_TRAINER_REDIS_URL: redis://redis:6379/0
      DSPY_TRAINER_QUEUE_NAME: dspy-trainer:jobs
      DSPY_TRAINER_DEPLOYER_BUILD_LOG_MAX_BYTES: ${DSPY_TRAINER_DEPLOYER_BUILD_LOG_MAX_BYTES:-262144}
      DSPY_TRAINER_DEPLOYER_IMAGE_REPOSITORY: ${DSPY_TRAINER_DEPLOYER_IMAGE_REPOSITORY:-dspy-trainer-revision}
      DSPY_TRAINER_DEPLOYER_PLATFORM_VERSION: ${DSPY_TRAINER_DEPLOYER_PLATFORM_VERSION:-local}
      DSPY_TRAINER_DEPLOYMENT_ID: ${DSPY_TRAINER_DEPLOYMENT_ID:?Set a stable deployment identity}
      DSPY_TRAINER_BUNDLE_INSTALL_MAX_CONCURRENCY: ${DSPY_TRAINER_BUNDLE_INSTALL_MAX_CONCURRENCY:-8}
      DSPY_TRAINER_MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_TRACKING_URI: http://mlflow:5000
      # Optional operator override; leave unset to use the backend default heartbeat TTL.
      DSPY_TRAINER_ENDPOINT_WORKER_HEARTBEAT_TTL_SECONDS:
      DSPY_TRAINER_CORS_ALLOW_ORIGINS: ${DSPY_TRAINER_CORS_ALLOW_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080,http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173}
      DSPY_TRAINER_GITHUB_PAT: ${GITHUB_PAT:-}
      DSPY_TRAINER_GIT_COMMIT_NAME: ${GIT_COMMIT_NAME:-DSPy Trainer}
      DSPY_TRAINER_GIT_COMMIT_EMAIL: ${GIT_COMMIT_EMAIL:-dspy-trainer@local}
      DSPY_TRAINER_MODULE_ENV_ENCRYPTION_KEY: ${DSPY_TRAINER_MODULE_ENV_ENCRYPTION_KEY:-}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
      VITE_MLFLOW_BASE_URL: ${VITE_MLFLOW_BASE_URL:-/mlflow}
      DSPY_TRAINER_BACKEND_HOST: 0.0.0.0
      DSPY_TRAINER_BACKEND_PORT: 8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    volumes:
      - bundles_data:/tmp/dspy-trainer/bundles
      - checkouts_data:/tmp/dspy-trainer/checkouts
      - optimization_artifacts_data:/tmp/dspy-trainer/optimization_artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "backend/worker.py"]
    deploy:
      replicas: ${DSPY_TRAINER_TOTAL_WORKERS:-8}
    environment:
      DSPY_TRAINER_POSTGRES_DSN: postgresql://postgres:postgres@postgres:5432/dspy_trainer
      DSPY_TRAINER_REDIS_URL: redis://redis:6379/0
      DSPY_TRAINER_QUEUE_NAME: dspy-trainer:jobs
      DSPY_TRAINER_BUNDLE_INSTALL_MAX_CONCURRENCY: ${DSPY_TRAINER_BUNDLE_INSTALL_MAX_CONCURRENCY:-8}
      DSPY_TRAINER_MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_TRACKING_URI: http://mlflow:5000
      DSPY_TRAINER_GITHUB_PAT: ${GITHUB_PAT:-}
      DSPY_TRAINER_GIT_COMMIT_NAME: ${GIT_COMMIT_NAME:-DSPy Trainer}
      DSPY_TRAINER_GIT_COMMIT_EMAIL: ${GIT_COMMIT_EMAIL:-dspy-trainer@local}
      DSPY_TRAINER_MODULE_ENV_ENCRYPTION_KEY: ${DSPY_TRAINER_MODULE_ENV_ENCRYPTION_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mlflow:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - bundles_data:/tmp/dspy-trainer/bundles
      - checkouts_data:/tmp/dspy-trainer/checkouts
      - optimization_artifacts_data:/tmp/dspy-trainer/optimization_artifacts
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, redis; redis.Redis.from_url(os.environ['DSPY_TRAINER_REDIS_URL']).ping()\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

  endpoint-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "backend/endpoint_worker.py"]
    deploy:
      replicas: ${DSPY_TRAINER_TOTAL_ENDPOINT_WORKER_REPLICAS:-72}
    environment:
      DSPY_TRAINER_POSTGRES_DSN: postgresql://postgres:postgres@postgres:5432/dspy_trainer
      DSPY_TRAINER_REDIS_URL: redis://redis:6379/0
      DSPY_TRAINER_QUEUE_NAME: dspy-trainer:jobs
      DSPY_TRAINER_BUNDLE_INSTALL_MAX_CONCURRENCY: ${DSPY_TRAINER_BUNDLE_INSTALL_MAX_CONCURRENCY:-8}
      DSPY_TRAINER_MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_TRACKING_URI: http://mlflow:5000
      # Optional operator override; leave unset to use the backend default heartbeat TTL.
      DSPY_TRAINER_ENDPOINT_WORKER_HEARTBEAT_TTL_SECONDS:
      DSPY_TRAINER_GITHUB_PAT: ${GITHUB_PAT:-}
      DSPY_TRAINER_GIT_COMMIT_NAME: ${GIT_COMMIT_NAME:-DSPy Trainer}
      DSPY_TRAINER_GIT_COMMIT_EMAIL: ${GIT_COMMIT_EMAIL:-dspy-trainer@local}
      DSPY_TRAINER_MODULE_ENV_ENCRYPTION_KEY: ${DSPY_TRAINER_MODULE_ENV_ENCRYPTION_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mlflow:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - bundles_data:/tmp/dspy-trainer/bundles
      - checkouts_data:/tmp/dspy-trainer/checkouts
      - optimization_artifacts_data:/tmp/dspy-trainer/optimization_artifacts
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, redis; redis.Redis.from_url(os.environ['DSPY_TRAINER_REDIS_URL']).ping()\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

  deployer:
    build:
      context: .
      dockerfile: backend/Deployer.Dockerfile
    image: ${DSPY_TRAINER_DEPLOYER_IMAGE:-dspy-trainer-deployer:local}
    command: ["python", "backend/deployer.py"]
    restart: unless-stopped
    environment:
      DSPY_TRAINER_POSTGRES_DSN: postgresql://postgres:postgres@postgres:5432/dspy_trainer
      DSPY_TRAINER_REDIS_URL: redis://redis:6379/0
      DSPY_TRAINER_QUEUE_NAME: dspy-trainer:jobs
      DSPY_TRAINER_ENDPOINT_QUEUE_PREFIX: dspy-trainer:endpoint-queues
      DSPY_TRAINER_ENDPOINT_INVOCATION_CHANNEL_PREFIX: dspy-trainer:endpoint-invocations
      DSPY_TRAINER_ENDPOINT_WORKER_HEARTBEAT_TTL_SECONDS: ${DSPY_TRAINER_ENDPOINT_WORKER_HEARTBEAT_TTL_SECONDS:-300}
      DSPY_TRAINER_MLFLOW_TRACKING_URI: http://mlflow:5000
      DSPY_TRAINER_MODULE_ENV_ENCRYPTION_KEY: ${DSPY_TRAINER_MODULE_ENV_ENCRYPTION_KEY:-}
      DSPY_TRAINER_DEPLOYER_LEADER_TIMEOUT_SECONDS: ${DSPY_TRAINER_DEPLOYER_LEADER_TIMEOUT_SECONDS:-15}
      DSPY_TRAINER_DEPLOYER_CLAIM_TIMEOUT_SECONDS: ${DSPY_TRAINER_DEPLOYER_CLAIM_TIMEOUT_SECONDS:-300}
      DSPY_TRAINER_DEPLOYER_POLL_INTERVAL_SECONDS: ${DSPY_TRAINER_DEPLOYER_POLL_INTERVAL_SECONDS:-1}
      DSPY_TRAINER_DEPLOYER_ENDPOINT_READINESS_TIMEOUT_SECONDS: ${DSPY_TRAINER_DEPLOYER_ENDPOINT_READINESS_TIMEOUT_SECONDS:-120}
      DSPY_TRAINER_DEPLOYER_ENDPOINT_DRAIN_TIMEOUT_SECONDS: ${DSPY_TRAINER_DEPLOYER_ENDPOINT_DRAIN_TIMEOUT_SECONDS:-300}
      DSPY_TRAINER_DEPLOYER_ENDPOINT_RECONCILE_INTERVAL_SECONDS: ${DSPY_TRAINER_DEPLOYER_ENDPOINT_RECONCILE_INTERVAL_SECONDS:-2}
      DSPY_TRAINER_DEPLOYER_IMAGE_RETENTION_COUNT: ${DSPY_TRAINER_DEPLOYER_IMAGE_RETENTION_COUNT:-2}
      DSPY_TRAINER_DEPLOYER_BUILD_LOG_MAX_BYTES: ${DSPY_TRAINER_DEPLOYER_BUILD_LOG_MAX_BYTES:-262144}
      DSPY_TRAINER_DEPLOYER_BACKEND_BASE_IMAGE: ${DSPY_TRAINER_BACKEND_IMAGE:-dspy-trainer-backend:local}
      DSPY_TRAINER_DEPLOYER_IMAGE_REPOSITORY: ${DSPY_TRAINER_DEPLOYER_IMAGE_REPOSITORY:-dspy-trainer-revision}
      DSPY_TRAINER_DEPLOYER_PLATFORM_VERSION: ${DSPY_TRAINER_DEPLOYER_PLATFORM_VERSION:-local}
      DSPY_TRAINER_MANAGED_LABEL_NAMESPACE: ${DSPY_TRAINER_MANAGED_LABEL_NAMESPACE:-io.dspy-trainer}
      DSPY_TRAINER_DEPLOYMENT_ID: ${DSPY_TRAINER_DEPLOYMENT_ID:?Set a stable deployment identity}
      DSPY_TRAINER_COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-dspy-trainer}
      DSPY_TRAINER_COMPOSE_NETWORK_NAME: ${DSPY_TRAINER_COMPOSE_NETWORK_NAME:-dspy-trainer}
      DSPY_TRAINER_COMPOSE_NETWORK_PROJECT_LABEL: ${DSPY_TRAINER_COMPOSE_NETWORK_PROJECT_LABEL:-${COMPOSE_PROJECT_NAME:-dspy-trainer}}
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - checkouts_data:/tmp/dspy-trainer/checkouts:ro
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "python", "backend/deployer.py", "--readiness"]
      interval: 15s
      timeout: 10s
      retries: 4
      start_period: 30s
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_MLFLOW_BASE_URL: ${VITE_MLFLOW_BASE_URL:-/mlflow}
    container_name: ${COMPOSE_PROJECT_NAME:-dspy-trainer}-web
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  caddy:
    image: caddy:2.8-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-dspy-trainer}-caddy
    depends_on:
      web:
        condition: service_healthy
      backend:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    ports:
      - "${CADDY_HTTP_PORT:-8080}:80"
    volumes:
      - ./ops/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
  mlflow_artifacts:
  bundles_data:
  checkouts_data:
  optimization_artifacts_data:
networks:
  default:
    name: ${DSPY_TRAINER_COMPOSE_NETWORK_NAME:-dspy-trainer}
